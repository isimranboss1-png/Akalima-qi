name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1 || true)"
          RAW_VER="$(echo "$JAVA_VER_LINE" | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [ -z "$RAW_VER" ]; then
            echo "::error::Failed to detect active Java version from output: $JAVA_VER_LINE"
            exit 1
          fi
          if [[ "$RAW_VER" == 1.* ]]; then
            MAJOR_VER="$(echo "$RAW_VER" | cut -d. -f2)"
          else
            MAJOR_VER="$(echo "$RAW_VER" | cut -d. -f1 | cut -d- -f1)"
          fi
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse Java major version from '$RAW_VER'."
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but Java $MAJOR_VER is active."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME:+$JAVA_HOME/bin/}keytool"
          if [ ! -f "./debug.keystore" ]; then
            if ! "$KEYTOOL_BIN" -genkeypair \
              -keystore "./debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1; then
              echo "::error::Failed to generate temporary ./debug.keystore."
              exit 1
            fi
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Temporary ./debug.keystore does not exist after creation."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::$EXPECTED_APK does not have a .apk extension."
            exit 1
          fi
          echo "Verified debug APK: $EXPECTED_APK ($(wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          RAW_REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME="$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/release-asset-XXXXXX")"
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"
          cp "$SOURCE_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset is invalid: $ASSET_PATH"
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Release asset validation failed for '$ASSET_PATH'."
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          RELEASE_NOTES="$(printf '%s\n' \
            "This is an automatically generated debug APK built by GitHub Actions." \
            "" \
            "- **Workflow Run Number:** ${GITHUB_RUN_NUMBER}" \
            "- **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}" \
            "- **Source Commit SHA:** ${GITHUB_SHA}" \
            "" \
            "### Testing & Signing Notice" \
            "- This APK is intended for testing and direct installation on Android devices." \
            "- This is **not** a Google Play Store production release." \
            "- This APK is signed only with a temporary debug keystore generated for this build.")"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: ${{ !cancelled() && steps.upload_artifact.outcome == 'success' && steps.prepare_asset.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            {
              echo "### Debug APK Build & GitHub Release Succeeded"
              echo ""
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **APK Asset:** \`${ASSET_NAME}\`"
              echo "- **Download Page:** ${RELEASE_URL}"
              echo ""
              echo "You can download \`${ASSET_NAME}\` directly from the **Assets** section of the release page above. The GitHub Actions artifact \`app-debug-apk\` is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "### Debug APK Built (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases failed, so no release URL was created."
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Backup Artifact:** Download \`app-debug-apk\` from this workflow run's **Artifacts** section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
